<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<title>Flyer · Cena de Fin de Año del Hockey</title>
<!-- Flyer para redes. Post: flyer.html (1080x1350) · Historia: flyer.html?formato=historia (1080x1920) -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0a1a6e;
    --royal: #3344b5;
    --royal-light: #8d9bff;
    --red: #d0282f;
    --muted: #5b6390;
    --W: 1080px;
    --H: 1350px;
  }
  .historia { --H: 1920px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--W); height: var(--H); overflow: hidden; background: #fff; }

  .flyer {
    position: relative;
    width: var(--W);
    height: var(--H);
    overflow: hidden;
    color: var(--navy);
    font-family: "Montserrat", sans-serif;
    background: #fdfcf9;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 84px 90px 0;
  }

  /* luces suaves de fondo */
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); pointer-events: none; }
  .glow--a { width: 620px; height: 520px; left: -160px; top: -180px; background: rgba(51, 68, 181, .20); }
  .glow--b { width: 560px; height: 480px; right: -180px; top: 120px; background: rgba(208, 40, 47, .13); }
  .glow--c { width: 700px; height: 400px; left: 190px; top: 520px; background: rgba(141, 155, 255, .14); }

  .confetti { position: absolute; inset: 0; pointer-events: none; z-index: 1; }

  /* marco doble */
  .frame {
    position: absolute; inset: 34px;
    border: 2px solid rgba(10, 26, 110, .16);
    border-radius: 30px;
    pointer-events: none; z-index: 1;
  }
  .frame::after {
    content: ""; position: absolute; inset: 10px;
    border: 1px solid rgba(10, 26, 110, .08);
    border-radius: 22px;
  }

  .z { position: relative; z-index: 2; }

  .logos { display: flex; align-items: center; gap: 40px; }
  .logos img { height: 128px; width: auto; }
  .logos img.andino { height: 108px; }
  .logos span { font-size: 40px; color: var(--royal-light); font-weight: 500; }

  .eyebrow {
    margin-top: 48px;
    white-space: nowrap;
    display: flex; align-items: center; gap: 22px;
    font-size: 25px; font-weight: 700;
    letter-spacing: .3em; text-transform: uppercase;
    color: var(--royal);
  }
  .eyebrow::before, .eyebrow::after {
    content: ""; width: 70px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--royal));
  }
  .eyebrow::after { transform: scaleX(-1); }

  h1 {
    margin-top: 6px;
    font-family: "Cormorant Garamond", serif;
    font-weight: 600;
    font-size: 132px; line-height: .9;
    color: var(--navy);
    letter-spacing: -.01em;
  }
  h1 em {
    display: inline-block;
    font-style: italic; font-weight: 600;
    font-size: 1.12em;
    background: linear-gradient(100deg, #0a1a6e 5%, #3344b5 45%, #d0282f 92%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    padding: 0 .08em .06em;
  }

  .tag {
    margin-top: 14px;
    display: flex; align-items: center; gap: 18px;
  }
  .tag svg { width: 64px; height: 64px; }
  .tag span {
    background: var(--red);
    color: #fff;
    font-size: 30px; font-weight: 800;
    letter-spacing: .42em; text-transform: uppercase;
    padding: 11px 26px 11px calc(26px + .42em);
    border-radius: 999px;
    box-shadow: 0 10px 24px rgba(208, 40, 47, .28), inset 0 -3px 0 rgba(0,0,0,.12);
  }

  /* bloque de fecha estilo calendario */
  .fecha {
    margin-top: 46px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 34px;
    width: 760px;
  }
  .fecha__lado {
    font-size: 30px; font-weight: 800;
    letter-spacing: .2em; text-transform: uppercase;
    padding: 16px 0;
    border-top: 2px solid rgba(10, 26, 110, .2);
    border-bottom: 2px solid rgba(10, 26, 110, .2);
  }
  .fecha__lado--hora { color: var(--red); }
  .fecha__dia {
    width: 172px; height: 172px;
    border-radius: 28px;
    background: linear-gradient(160deg, #3344b5, #0a1a6e);
    color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 18px 40px rgba(10, 26, 110, .28);
    position: relative;
    overflow: hidden;
  }
  .fecha__dia::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 38px;
    background: var(--red);
  }
  .fecha__dia small {
    position: absolute; top: 0; left: 0; right: 0; height: 38px;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 800; letter-spacing: .24em; text-transform: uppercase;
    padding-left: .24em;
  }
  .fecha__dia b {
    font-family: "Cormorant Garamond", serif;
    font-size: 120px; font-weight: 700; line-height: 1;
    margin-top: 32px;
  }

  .lugar {
    margin-top: 26px;
    display: flex; align-items: center; gap: 12px;
    font-size: 27px; font-weight: 600; color: var(--muted);
  }
  .lugar svg { width: 30px; height: 30px; stroke: var(--red); fill: none; stroke-width: 2; }
  .lugar strong { color: var(--navy); }

  .extras {
    margin-top: 36px;
    display: flex; gap: 12px; flex-wrap: nowrap; justify-content: center;
  }
  .extras li {
    list-style: none;
    display: flex; align-items: center; gap: 10px;
    font-size: 23px; font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase;
    padding: 13px 24px 13px 20px;
    border-radius: 999px;
    border: 2px solid rgba(51, 68, 181, .22);
    background: rgba(255, 255, 255, .85);
    color: var(--navy);
    box-shadow: 0 6px 16px rgba(10, 26, 110, .06);
  }
  .extras svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .extras li.hot { background: var(--royal); color: #fff; border-color: var(--royal); box-shadow: 0 10px 22px rgba(51, 68, 181, .3); }

  .entradas {
    margin-top: 26px;
    font-size: 25px; font-weight: 600; color: var(--muted);
  }
  .entradas strong { color: var(--navy); }

  /* cancha al pie */
  .pitch {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 230px;
    z-index: 1;
  }
  .pitch svg { width: 100%; height: 100%; display: block; }

  /* ---- Historia (9:16) ---- */
  .historia .flyer { padding-top: 190px; }
  .historia .logos img { height: 160px; }
  .historia .logos img.andino { height: 136px; }
  .historia .eyebrow { margin-top: 90px; font-size: 27px; }
  .historia .eyebrow::before, .historia .eyebrow::after { width: 50px; }
  .historia h1 { font-size: 156px; margin-top: 14px; }
  .historia .tag { margin-top: 26px; }
  .historia .tag span { font-size: 34px; }
  .historia .fecha { margin-top: 80px; width: 860px; }
  .historia .fecha__lado { font-size: 34px; }
  .historia .fecha__dia { width: 200px; height: 200px; }
  .historia .fecha__dia b { font-size: 140px; }
  .historia .lugar { margin-top: 40px; font-size: 30px; }
  .historia .extras { margin-top: 56px; gap: 14px; }
  .historia .extras li { font-size: 25px; padding: 16px 26px 16px 22px; }
  .historia .extras svg { width: 32px; height: 32px; }
  .historia .entradas { margin-top: 50px; font-size: 30px; }
  .historia .pitch { height: 330px; }
  .brindis { display: none; }
  .historia .brindis {
    display: block; margin-top: 46px;
    font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 600;
    font-size: 58px; color: var(--red);
  }
</style>
</head>
<body>
<script>
  if (new URLSearchParams(location.search).get("formato") === "historia") document.documentElement.classList.add("historia");
</script>

<div class="flyer">
  <div class="glow glow--a"></div>
  <div class="glow glow--b"></div>
  <div class="glow glow--c"></div>
  <svg class="confetti" aria-hidden="true"></svg>
  <div class="frame"></div>

  <div class="logos z">
    <img class="andino" src="../img/logo-andino-color.png" alt="Club Andino Mendoza">
    <span>×</span>
    <img src="../img/logo-regatas-color.png" alt="Club Mendoza de Regatas">
  </div>

  <p class="eyebrow z">Regatas Andino te invita a la</p>
  <h1 class="z">Cena de<br><em>Fin de Año</em></h1>

  <div class="tag z">
    <!-- palo de hockey -->
    <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M50 4 L26 48 Q21 57 13 55 Q6 53 9 46" fill="none" stroke="#0a1a6e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M46 12 L40 23" stroke="#d0282f" stroke-width="7" stroke-linecap="round"/><circle cx="50" cy="54" r="6" fill="#d0282f"/></svg>
    <span>Hockey</span>
    <svg viewBox="0 0 64 64" aria-hidden="true" style="transform:scaleX(-1)"><path d="M50 4 L26 48 Q21 57 13 55 Q6 53 9 46" fill="none" stroke="#0a1a6e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M46 12 L40 23" stroke="#d0282f" stroke-width="7" stroke-linecap="round"/><circle cx="50" cy="54" r="6" fill="#d0282f"/></svg>
  </div>

  <div class="fecha z">
    <p class="fecha__lado">Sábado</p>
    <div class="fecha__dia"><small>Diciembre</small><b>12</b></div>
    <p class="fecha__lado fecha__lado--hora">20 hs</p>
  </div>

  <p class="lugar z">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
    <span><strong>Restaurante de Regatas</strong> · Parque Gral. San Martín</span>
  </p>

  <ul class="extras z">
    <li><svg viewBox="0 0 24 24"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 21V3c-2 1-3 3.5-3 7h3"/></svg>Cena</li>
    <li class="hot"><svg viewBox="0 0 24 24"><path d="M7 3h10l-1 7a4 4 0 0 1-8 0L7 3ZM12 14v7M8 21h8M7.5 7h9"/></svg>Barra libre</li>
    <li><svg viewBox="0 0 24 24"><path d="M4 5c5-2 11-2 16 0L12 21 4 5Z"/><path d="M5.6 8.4c4-1.3 8.8-1.3 12.8 0"/><circle cx="10" cy="11.5" r="1"/><circle cx="14" cy="13.5" r="1"/></svg>Pizzetas</li>
    <li><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><path d="M12 3a9 9 0 0 1 9 9"/></svg>DJ</li>
  </ul>

  <p class="entradas z">Entradas <strong>anticipadas</strong> · ¡Hasta en <strong>2 cuotas</strong>!</p>
  <p class="brindis z">¡Brindemos por el 2027!</p>

  <!-- cancha de hockey vista desde arriba, con borde ondulado -->
  <div class="pitch" aria-hidden="true">
    <svg viewBox="0 0 1080 230" preserveAspectRatio="xMidYMax slice">
      <defs>
        <linearGradient id="cesped" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3a4cc2"/>
          <stop offset="1" stop-color="#1e2b8f"/>
        </linearGradient>
        <clipPath id="ola"><path d="M0 70 C 200 20, 360 20, 540 48 S 880 92, 1080 34 L1080 230 L0 230 Z"/></clipPath>
        <pattern id="red" width="9" height="9" patternUnits="userSpaceOnUse">
          <path d="M0 0L9 9M9 0L0 9" stroke="rgba(255,255,255,.4)" stroke-width="1"/>
        </pattern>
      </defs>
      <!-- sombra roja detrás de la ola -->
      <path d="M0 58 C 200 8, 360 8, 540 36 S 880 80, 1080 22 L1080 230 L0 230 Z" fill="#d0282f"/>
      <g clip-path="url(#ola)">
        <rect width="1080" height="230" fill="url(#cesped)"/>
        <!-- franjas del césped -->
        <g fill="rgba(255,255,255,.05)">
          <rect x="0" width="90" height="230"/><rect x="180" width="90" height="230"/><rect x="360" width="90" height="230"/>
          <rect x="540" width="90" height="230"/><rect x="720" width="90" height="230"/><rect x="900" width="90" height="230"/>
        </g>
        <g fill="none" stroke="rgba(255,255,255,.85)" stroke-width="3">
          <path d="M330 230 A150 150 0 0 1 480 80 L600 80 A150 150 0 0 1 750 230"/>
          <path d="M280 230 A200 200 0 0 1 480 30 L600 30 A200 200 0 0 1 800 230" stroke-dasharray="14 12" opacity=".55"/>
        </g>
        <!-- arco -->
        <rect x="490" y="212" width="100" height="18" fill="url(#red)"/>
        <path d="M490 230 L490 212 L590 212 L590 230" fill="none" stroke="#fff" stroke-width="4"/>
        <circle cx="540" cy="160" r="4" fill="#fff"/>
        <!-- recorrido de la bocha -->
        <path d="M150 210 C 260 110, 400 110, 512 128" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>
        <circle cx="530" cy="132" r="18" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="3"/>
        <circle cx="530" cy="132" r="10" fill="#fff"/>
      </g>
    </svg>
  </div>
</div>

<script>
  // Papel picado (semilla fija para que el PNG salga siempre igual)
  (function () {
    const svg = document.querySelector(".confetti");
    const historia = document.documentElement.classList.contains("historia");
    const W = 1080, H = historia ? 1920 : 1350;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    let s = 11;
    const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    const colores = ["#3344b5", "#d0282f", "#0a1a6e", "#8d9bff", "#ff8a8f"];
    let html = "";
    const total = historia ? 70 : 54;
    for (let i = 0; i < total; i++) {
      // casi todo sobre los costados, para no tapar el texto
      const lado = rnd() < .5;
      const x = lado ? 45 + rnd() * 105 : W - 45 - rnd() * 105;
      const y = 50 + rnd() * (H * 0.72);
      const c = colores[Math.floor(rnd() * colores.length)];
      const rot = Math.round(rnd() * 360);
      const o = (rnd() * .5 + .45).toFixed(2);
      const tipo = rnd();
      if (tipo < .5) {
        const w = 8 + rnd() * 10, h = 14 + rnd() * 14;
        html += `<rect x="${(x - w / 2).toFixed(1)}" y="${(y - h / 2).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${c}" opacity="${o}" transform="rotate(${rot} ${x.toFixed(1)} ${y.toFixed(1)})"/>`;
      } else if (tipo < .75) {
        html += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(4 + rnd() * 5).toFixed(1)}" fill="${c}" opacity="${o}"/>`;
      } else {
        // serpentina
        const l = 26 + rnd() * 20;
        html += `<path d="M${x.toFixed(1)} ${y.toFixed(1)} q ${l / 4} -10 ${l / 2} 0 t ${l / 2} 0" fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round" opacity="${o}" transform="rotate(${rot} ${x.toFixed(1)} ${y.toFixed(1)})"/>`;
      }
    }
    // destellos
    const destello = (x, y, r, c) =>
      `<path d="M${x} ${y - r} Q${x} ${y} ${x + r} ${y} Q${x} ${y} ${x} ${y + r} Q${x} ${y} ${x - r} ${y} Q${x} ${y} ${x} ${y - r}Z" fill="${c}"/>`;
    html += destello(250, historia ? 520 : 400, 18, "#d0282f");
    html += destello(845, historia ? 590 : 360, 14, "#3344b5");
    html += destello(860, historia ? 860 : 620, 20, "#8d9bff");
    html += destello(215, historia ? 900 : 650, 12, "#3344b5");
    svg.innerHTML = html;
  })();
</script>
</body>
</html>
