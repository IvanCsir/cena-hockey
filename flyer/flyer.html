<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<title>Flyer · Cena de Fin de Año del Hockey</title>
<!-- Flyer para redes. Post: flyer.html (1080x1350) · Historia: flyer.html?formato=historia (1080x1920) -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500;1,600&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0a1a6e;
    --royal: #3344b5;
    --red: #d0282f;
    --text: #2a3160;
    --muted: #5b6390;
    --W: 1080px;
    --H: 1350px;
  }
  .historia { --H: 1920px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--W); height: var(--H); overflow: hidden; background: #fff; }

  .flyer {
    position: relative;
    width: var(--W);
    height: var(--H);
    overflow: hidden;
    color: var(--navy);
    font-family: "Montserrat", sans-serif;
    background:
      radial-gradient(70% 40% at 50% 0%, rgba(51, 68, 181, .10) 0%, transparent 70%),
      radial-gradient(60% 30% at 100% 70%, rgba(208, 40, 47, .06) 0%, transparent 70%),
      #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 90px 80px 0;
  }

  /* marco fino */
  .frame {
    position: absolute; inset: 36px;
    border: 2px solid rgba(10, 26, 110, .14);
    border-radius: 28px;
    pointer-events: none;
  }

  .logos { display: flex; align-items: center; gap: 44px; position: relative; z-index: 2; }
  .logos img { height: 150px; width: auto; }
  .logos img.andino { height: 128px; }
  .logos span { font-size: 44px; color: var(--royal); font-weight: 500; }

  .eyebrow {
    margin-top: 56px;
    font-size: 30px; font-weight: 600;
    letter-spacing: .28em; text-transform: uppercase;
    color: var(--royal);
    position: relative; z-index: 2;
  }

  h1 {
    margin-top: 14px;
    font-family: "Cormorant Garamond", serif;
    font-weight: 600;
    font-size: 150px; line-height: .92;
    color: var(--navy);
    position: relative; z-index: 2;
  }
  h1 em {
    font-style: italic; font-weight: 600;
    background: linear-gradient(100deg, #0a1a6e 10%, #3344b5 50%, #d0282f 95%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    padding: 0 .06em;
  }

  .tag {
    margin-top: 26px;
    display: inline-block;
    background: var(--red);
    color: #fff;
    font-size: 34px; font-weight: 800;
    letter-spacing: .4em; text-transform: uppercase;
    padding: 12px 28px 12px calc(28px + .4em);
    border-radius: 999px;
    box-shadow: 0 10px 26px rgba(208, 40, 47, .3);
    position: relative; z-index: 2;
  }

  .info {
    margin-top: 50px;
    display: grid; gap: 10px;
    position: relative; z-index: 2;
  }
  .info .fecha { font-size: 54px; font-weight: 800; letter-spacing: -.01em; white-space: nowrap; }
  .info .fecha b { color: var(--red); font-weight: 800; }
  .info .lugar { font-size: 30px; font-weight: 500; color: var(--muted); }

  .extras {
    margin-top: 38px;
    display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;
    position: relative; z-index: 2;
  }
  .extras li {
    list-style: none;
    font-size: 26px; font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase;
    padding: 14px 26px;
    border-radius: 999px;
    border: 2px solid rgba(51, 68, 181, .3);
    background: #fff;
    color: var(--navy);
  }
  .extras li.hot { background: var(--royal); color: #fff; border-color: var(--royal); }

  .entradas {
    margin-top: 42px;
    font-size: 28px; font-weight: 600; color: var(--muted);
    position: relative; z-index: 2;
  }
  .entradas strong { color: var(--navy); }

  /* cancha al pie */
  .pitch {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 300px;
    z-index: 1;
  }
  .pitch svg { width: 100%; height: 100%; display: block; }

  /* ---- Historia (9:16) ---- */
  .historia .flyer { padding-top: 210px; }
  .historia .logos img { height: 180px; }
  .historia .logos img.andino { height: 154px; }
  .historia .eyebrow { margin-top: 90px; font-size: 34px; }
  .historia h1 { font-size: 172px; margin-top: 20px; }
  .historia .tag { margin-top: 36px; font-size: 38px; }
  .historia .info { margin-top: 80px; gap: 16px; }
  .historia .info .fecha { font-size: 56px; }
  .historia .info .lugar { font-size: 34px; }
  .historia .extras { margin-top: 56px; }
  .historia .extras li { font-size: 30px; }
  .historia .entradas { margin-top: 70px; font-size: 32px; }
  .historia .pitch { height: 380px; }
</style>
</head>
<body>
<script>
  if (new URLSearchParams(location.search).get("formato") === "historia") document.documentElement.classList.add("historia");
</script>

<div class="flyer">
  <div class="frame"></div>

  <div class="logos">
    <img class="andino" src="../img/logo-andino-color.png" alt="Club Andino Mendoza">
    <span>×</span>
    <img src="../img/logo-regatas-color.png" alt="Club Mendoza de Regatas">
  </div>

  <p class="eyebrow">Regatas Andino te invita a la</p>
  <h1>Cena de<br><em>Fin de Año</em></h1>
  <p class="tag">Hockey</p>

  <div class="info">
    <p class="fecha">Sábado 12 de diciembre · <b>20 hs</b></p>
    <p class="lugar">Restaurante de Regatas · Parque General San Martín</p>
  </div>

  <ul class="extras">
    <li>Cena</li>
    <li class="hot">Barra libre</li>
    <li>Pizzetas</li>
    <li>DJ</li>
  </ul>

  <p class="entradas">Entradas <strong>anticipadas</strong> · ¡Hasta en <strong>2 cuotas</strong>!</p>

  <!-- cancha de hockey vista desde arriba, como en la invitación -->
  <div class="pitch" aria-hidden="true">
    <svg viewBox="0 0 1080 300" preserveAspectRatio="xMidYMax slice">
      <defs>
        <linearGradient id="cesped" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3344b5" stop-opacity="0"/>
          <stop offset=".35" stop-color="#3344b5" stop-opacity=".9"/>
          <stop offset="1" stop-color="#22309a"/>
        </linearGradient>
      </defs>
      <rect x="0" y="0" width="1080" height="300" fill="url(#cesped)"/>
      <g fill="none" stroke="rgba(255,255,255,.85)" stroke-width="3">
        <line x1="0" y1="300" x2="1080" y2="300"/>
        <path d="M290 300 A190 190 0 0 1 480 110 L600 110 A190 190 0 0 1 790 300"/>
        <path d="M240 300 A240 240 0 0 1 480 60 L600 60 A240 240 0 0 1 840 300" stroke-dasharray="14 12" opacity=".6"/>
      </g>
      <circle cx="540" cy="215" r="5" fill="#fff"/>
      <circle cx="540" cy="170" r="20" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="3"/>
      <circle cx="540" cy="170" r="11" fill="#fff"/>
    </svg>
  </div>
</div>
</body>
</html>
