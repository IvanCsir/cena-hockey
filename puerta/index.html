<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Ingreso · Cena del Hockey</title>
  <meta name="theme-color" content="#0a1a6e">
  <link rel="icon" href="../img/logo-regatas.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --azul: #0a1a6e; --royal: #3344b5; --rojo: #d0282f;
      --texto: #1d2450; --suave: #5b6390; --linea: rgba(10, 26, 110, .12);
      --fondo: #eef1ff; --panel: #ffffff;
      --ok: #157a3c; --ok-bg: #e3f6ea;
      --amarillo: #8a6100; --amarillo-bg: #fff4d6;
      --falta: #b3261e; --falta-bg: #fde6e4;
      --revisar: #6a3fb5; --revisar-bg: #efe7fd;
      --radio: 16px;
    }
    * { box-sizing: border-box; }
    /* overscroll contain: el "estirar para actualizar" es propio (el del navegador recarga
       la página entera, y sin señal la deja en blanco) */
    html, body { overscroll-behavior-y: contain; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; font-family: "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--fondo); color: var(--texto); }
    button { font: inherit; cursor: pointer; }
    [hidden] { display: none !important; }

    /* Cabecera fija con contador y buscador */
    .top { position: sticky; top: 0; z-index: 5; background: var(--azul); color: #fff; padding: 12px 16px 14px; padding-top: max(12px, env(safe-area-inset-top)); box-shadow: 0 6px 20px rgba(10, 26, 110, .25); }
    .top__fila { display: flex; align-items: center; gap: 12px; max-width: 720px; margin: 0 auto; }
    .top__titulo { flex: 1; min-width: 0; }
    .top__titulo h1 { margin: 0; font-size: 1rem; font-weight: 700; letter-spacing: .02em; }
    .top__sync { margin: 2px 0 0; font-size: .72rem; color: #c9d0ff; }
    .top__sync.is-offline { color: #ffd27a; }
    .contador { text-align: right; line-height: 1.1; }
    .contador strong { display: block; font-size: 1.5rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .contador span { font-size: .7rem; color: #c9d0ff; }
    .buscar { position: relative; max-width: 720px; margin: 12px auto 0; }
    .buscar input { width: 100%; font: inherit; font-size: 1.15rem; padding: 14px 48px 14px 16px; border-radius: 12px; border: 0; background: #fff; color: var(--texto); outline: none; }
    .buscar input:focus { box-shadow: 0 0 0 3px #8d9bff; }
    .buscar button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border: 0; border-radius: 10px; background: #e7eaff; color: var(--azul); font-size: 1.2rem; }

    main { max-width: 720px; margin: 0 auto; padding: 14px 16px 90px; }
    .ptr { height: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--suave); font-size: .85rem; font-weight: 600; }
    .ptr.is-suelto { transition: height .25s ease; }
    .ptr__flecha { display: inline-block; transition: transform .2s; font-size: 1.1rem; }
    .ptr.is-listo .ptr__flecha { transform: rotate(180deg); }
    .ptr.is-cargando .ptr__flecha { animation: girar .8s linear infinite; }
    @keyframes girar { to { transform: rotate(360deg); } }
    .ayuda { color: var(--suave); font-size: .85rem; text-align: center; margin: 18px 8px; line-height: 1.5; }

    /* Tarjeta de cada compra */
    .g { background: var(--panel); border-radius: var(--radio); padding: 14px 14px 12px; margin-bottom: 12px; border-left: 6px solid var(--ok); box-shadow: 0 2px 10px rgba(10, 26, 110, .06); }
    .g--sinverificar { border-left-color: #e0a800; }
    .g--falta { border-left-color: var(--falta); }
    .g--revisar { border-left-color: var(--revisar); }
    .g__top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .g h2 { margin: 0; font-size: 1.15rem; line-height: 1.25; font-weight: 700; color: var(--azul); }
    .estado { flex-shrink: 0; font-size: .78rem; font-weight: 700; padding: 5px 9px; border-radius: 999px; background: var(--ok-bg); color: var(--ok); white-space: nowrap; }
    .estado--sinverificar { background: var(--amarillo-bg); color: var(--amarillo); }
    .estado--falta { background: var(--falta-bg); color: var(--falta); }
    .estado--revisar { background: var(--revisar-bg); color: var(--revisar); }
    .g__quienes { margin: 6px 0 0; font-size: .95rem; }
    .g__quienes b { color: var(--suave); font-weight: 600; }
    .g__meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 8px 0 0; font-size: .8rem; color: var(--suave); }
    .chip { background: #e7eaff; color: var(--azul); font-weight: 700; padding: 3px 8px; border-radius: 8px; }
    .g__nota { margin: 8px 0 0; padding: 8px 10px; border-radius: 10px; background: var(--revisar-bg); color: #3f2475; font-size: .82rem; line-height: 1.4; }
    .ingreso { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--linea); }
    .ingreso__menos { width: 46px; height: 46px; border-radius: 12px; border: 1px solid var(--linea); background: #fff; color: var(--azul); font-size: 1.4rem; font-weight: 700; }
    .ingreso__menos:disabled { opacity: .3; cursor: default; }
    .ingreso__cuenta { flex: 1; font-size: .85rem; color: var(--suave); }
    .ingreso__cuenta strong { font-size: 1.3rem; color: var(--texto); font-variant-numeric: tabular-nums; }
    .ingreso__mas { min-width: 128px; height: 46px; border-radius: 12px; border: 0; background: var(--royal); color: #fff; font-weight: 700; font-size: 1rem; padding: 0 16px; }
    .ingreso__mas:disabled { background: var(--ok-bg); color: var(--ok); cursor: default; }
    .g.is-completo { opacity: .75; }

    /* Pantalla de clave */
    .login { max-width: 420px; margin: 40px auto; background: #fff; border-radius: var(--radio); padding: 22px; box-shadow: 0 2px 10px rgba(10, 26, 110, .08); }
    .login h2 { margin: 0 0 6px; color: var(--azul); font-size: 1.2rem; }
    .login p { margin: 0 0 14px; color: var(--suave); font-size: .9rem; line-height: 1.5; }
    .login input { width: 100%; font: inherit; font-size: 1.1rem; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--linea); margin-bottom: 12px; }
    .login button { width: 100%; height: 48px; border: 0; border-radius: 12px; background: var(--royal); color: #fff; font-weight: 700; font-size: 1rem; }
    .login__error { color: var(--falta) !important; font-weight: 600; }

    .pie { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }
    .pie button { border: 1px solid var(--linea); background: #fff; color: var(--azul); border-radius: 10px; padding: 10px 14px; font-size: .85rem; font-weight: 600; }

    .toast { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0; transition: .25s; background: var(--azul); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: .9rem; font-weight: 600; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); max-width: calc(100% - 32px); text-align: center; z-index: 10; pointer-events: none; }
    .toast.is-visible { opacity: 1; transform: translate(-50%, 0); }
    /* Pestañas Ingreso / Pagos */
    .tabs { display: flex; gap: 6px; max-width: 720px; margin: 12px auto 0; }
    .tabs button { flex: 1; height: 38px; border: 0; border-radius: 10px; background: rgba(255, 255, 255, .12); color: #dfe4ff; font-weight: 700; font-size: .9rem; }
    .tabs button[aria-pressed="true"] { background: #fff; color: var(--azul); }
    .tabs__n { display: inline-block; min-width: 20px; margin-left: 4px; padding: 1px 6px; border-radius: 999px; background: var(--rojo); color: #fff; font-size: .72rem; }

    /* Apartado Pagos */
    .cuotas { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
    .cuota { padding: 9px 10px; border-radius: 10px; background: #f4f6ff; font-size: .88rem; }
    .cuota.is-ok { background: var(--ok-bg); }
    .cuota__fila { display: flex; justify-content: space-between; gap: 8px; }
    .cuota__est { font-size: .78rem; font-weight: 700; white-space: nowrap; }
    .cuota__chequeo { margin: 5px 0 0; font-size: .8rem; color: var(--ok); line-height: 1.4; }
    .cuota__chequeo.is-mal { color: var(--falta); }
    .cuota a { display: inline-block; margin-top: 5px; font-size: .8rem; font-weight: 600; color: var(--royal); }
    .acciones { display: flex; gap: 8px; margin-top: 12px; }
    .acciones button, .lote { flex: 1; min-height: 46px; border: 0; border-radius: 12px; background: var(--royal); color: #fff; font-weight: 700; font-size: .95rem; padding: 0 12px; }
    .acciones .secundario { background: #fff; color: var(--azul); border: 1px solid var(--linea); }
    .acciones button:disabled, .lote:disabled { opacity: .6; cursor: default; }
    .lote { width: 100%; margin-bottom: 4px; }
    .filtros { display: flex; gap: 6px; margin-bottom: 4px; }
    .filtros button { flex: 1; min-width: 0; min-height: 40px; padding: 4px 6px; line-height: 1.15; border: 1px solid var(--linea); border-radius: 10px; background: #fff; color: var(--azul); font-weight: 700; font-size: .85rem; }
    .filtros button[aria-pressed="true"] { background: var(--azul); color: #fff; border-color: var(--azul); }
    .wsp { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 46px; border-radius: 12px; background: #1fa855; color: #fff; font-weight: 700; font-size: .95rem; text-decoration: none; padding: 0 12px; text-align: center; }
    .is-completo .wsp { background: #fff; color: #157a3c; border: 1px solid #b9e3c8; }

    .demo { background: #ffd27a; color: #4a3500; text-align: center; font-size: .78rem; font-weight: 700; padding: 6px; }
  </style>
</head>
<body>
  <div class="demo" data-demo hidden>MODO DEMO · datos inventados, nada se guarda</div>

  <header class="top">
    <div class="top__fila">
      <div class="top__titulo">
        <h1>Ingreso · Cena del Hockey</h1>
        <p class="top__sync" data-sync>Cargando…</p>
      </div>
      <div class="contador" data-contador hidden>
        <strong data-cont-num>0 / 0</strong>
        <span>ingresaron</span>
      </div>
    </div>
    <nav class="tabs" data-tabs hidden>
      <button type="button" data-tab="ingreso" aria-pressed="true">Ingreso</button>
      <button type="button" data-tab="pagos" aria-pressed="false">Pagos<span class="tabs__n" data-pend-n hidden></span></button>
    </nav>
    <div class="buscar" data-buscar hidden>
      <input type="text" placeholder="Nombre, apellido o categoría" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Buscar" data-q>
      <button type="button" aria-label="Borrar búsqueda" data-limpiar hidden>✕</button>
    </div>
  </header>

  <div class="ptr" aria-hidden="true" data-ptr><span class="ptr__flecha">↓</span><span data-ptr-txt>Estirá para actualizar</span></div>

  <main>
    <form class="login" data-login hidden>
      <h2>Clave de la puerta</h2>
      <p>Pedísela a quien organiza. Queda guardada en este celular.</p>
      <p class="login__error" data-login-error hidden>La clave no es correcta.</p>
      <input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" required aria-label="Clave" data-clave>
      <button type="submit">Entrar</button>
    </form>

    <div data-lista></div>

    <div class="pie" data-pie hidden>
      <button type="button" data-actualizar>Actualizar lista</button>
      <button type="button" data-salir>Cerrar sesión</button>
    </div>
  </main>

  <div class="toast" role="status" aria-live="polite" data-toast></div>

  <script>
  (() => {
    // Misma URL que CONFIG.sheetsUrl en js/main.js
    const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbyA_TEJ6taShaEVKJBW1iI_juR6ZKE4uCQwFzwgGPgpRHqJGvPZmw3w_-fTOG5ePkYV/exec";
    const CADA = 20000; // cada cuánto se sincroniza con la planilla (ms)
    const MAX_TARJETAS = 60;

    const DEMO = new URLSearchParams(location.search).has("demo");
    const K = DEMO ? "puerta.demo." : "puerta.";
    const $ = (s) => document.querySelector(s);

    const guardado = {
      leer(k, def) { try { const v = localStorage.getItem(K + k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } },
      escribir(k, v) { try { localStorage.setItem(K + k, JSON.stringify(v)); } catch (e) { /* sin almacenamiento */ } },
      borrar(k) { try { localStorage.removeItem(K + k); } catch (e) { /* nada */ } },
    };

    // La clave puede venir en el link: …/puerta/#clave=xxxx (el # no viaja a ningún servidor)
    const enLink = location.hash.match(/clave=([^&]+)/);
    if (enLink) {
      guardado.escribir("clave", decodeURIComponent(enLink[1]));
      history.replaceState(null, "", location.pathname + location.search);
    }

    let clave = DEMO ? "demo" : guardado.leer("clave", "");
    let datos = DEMO ? null : guardado.leer("datos", null);          // { grupos, totales, actualizado }
    let pendientes = guardado.leer("pendientes", []);  // toques todavía no guardados en la planilla
    let ultimoGuardado = 0;
    let enviando = false;
    let aviso = "";
    let listaVieja = false;
    let vista = guardado.leer("vista", "ingreso") === "pagos" ? "pagos" : "ingreso";
    let filtroPagos = guardado.leer("filtroPagos", "sinverificar");
    if (["sinverificar", "falta", "revisar"].indexOf(filtroPagos) < 0) filtroPagos = "sinverificar";

    const pesos = (n) => "$ " + Number(n).toLocaleString("es-AR");
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

    function toast(txt) {
      const t = $("[data-toast]");
      t.textContent = txt;
      t.classList.add("is-visible");
      clearTimeout(toast.t);
      toast.t = setTimeout(() => t.classList.remove("is-visible"), 2200);
    }

    function ingresaron(g) {
      const extra = pendientes.filter((p) => p.id === g.id).reduce((a, p) => a + p.delta, 0);
      return Math.max(0, Math.min(g.total, g.ingresaron + extra));
    }

    // ───────── Estado de conexión ─────────
    function mostrarSync(error) {
      const el = $("[data-sync]");
      const n = pendientes.length;
      let txt;
      if (DEMO) txt = "Modo demo";
      else if (aviso && !datos) txt = aviso;
      else if (!navigator.onLine || error) txt = "Sin conexión" + (n ? ` · ${n} sin guardar` : " · usando la última lista");
      else if (n) txt = `Guardando ${n}…`;
      else if (datos && datos.actualizado) {
        const min = Math.round((Date.now() - new Date(datos.actualizado)) / 60000);
        txt = "Actualizado " + (min < 1 ? "recién" : `hace ${min} min`);
      } else txt = "Cargando…";
      el.textContent = txt;
      el.classList.toggle("is-offline", !DEMO && (!navigator.onLine || !!error || n > 0));
    }

    // ───────── Datos ─────────
    async function cargar() {
      if (DEMO) { if (!datos) datos = datosDemo(); render(); return true; }
      const inicio = Date.now();
      try {
        const res = await fetch(`${URL_SCRIPT}?accion=puerta&clave=${encodeURIComponent(clave)}`, { cache: "no-store" });
        const json = await res.json();
        if (json.error === "clave") return pedirClave(true);
        if (!json.ok) throw new Error(json.error || "Error");
        if (!Array.isArray(json.grupos)) {
          // El Apps Script todavía es la versión vieja (falta "Nueva versión" en Implementar)
          aviso = "La planilla todavía no está actualizada para el ingreso";
          return;
        }
        // Si mientras tanto se guardó un toque, esta lista ya está vieja: se espera a la próxima
        if (inicio < ultimoGuardado) return false;
        aviso = "";
        datos = { grupos: json.grupos, totales: json.totales, actualizado: json.actualizado };
        guardado.escribir("datos", datos);
        render();
        return true;
      } catch (e) {
        mostrarSync(true);
        return false;
      }
    }

    async function enviarPendientes() {
      if (DEMO || enviando || !pendientes.length) return;
      enviando = true;
      try {
        while (pendientes.length) {
          const p = pendientes[0];
          let json;
          try {
            const res = await fetch(URL_SCRIPT, {
              method: "POST",
              headers: { "Content-Type": "text/plain;charset=utf-8" },
              body: JSON.stringify({ accion: "ingreso", clave, fila: p.id, nombre: p.nombre, delta: p.delta, op: p.op }),
            });
            json = await res.json();
          } catch (e) {
            mostrarSync(true);
            break; // sin señal: se reintenta después con el mismo id, sin contar dos veces
          }
          if (json.error === "clave") { pedirClave(true); break; }
          pendientes.shift();
          if (json.ok) {
            const g = datos && datos.grupos.find((x) => x.id === json.id);
            if (g) g.ingresaron = json.ingresaron;
            ultimoGuardado = Date.now();
          } else if (json.error === "cambio") {
            // Alguien ordenó o borró filas en la planilla: ese toque no se guardó
            listaVieja = true;
            alert(`La planilla cambió y el ingreso de ${p.nombre || "esa compra"} NO se guardó.\nLa lista se va a actualizar: buscalo de nuevo y volvé a marcarlo.`);
          } else {
            toast("No se pudo guardar: " + (json.error || "error"));
          }
          guardado.escribir("pendientes", pendientes);
          guardado.escribir("datos", datos);
        }
      } finally {
        enviando = false;
        render();
      }
      if (listaVieja && !pendientes.length) {
        listaVieja = false;
        ultimoGuardado = 0;
        await cargar();
      }
    }

    async function sincronizar() {
      if (!clave) return false;
      await enviarPendientes();
      const ok = !pendientes.length && await cargar();
      mostrarSync(!ok && !navigator.onLine);
      return ok;
    }

    // ───────── Estirar para actualizar ─────────
    const ptr = $("[data-ptr]");
    const ptrTxt = $("[data-ptr-txt]");
    const UMBRAL = 64;
    let y0 = null;
    let estirado = 0;
    let actualizando = false;
    window.addEventListener("touchstart", (e) => {
      const puede = !actualizando && datos && window.scrollY <= 0 && !e.target.closest("input, button");
      y0 = puede ? e.touches[0].clientY : null;
      estirado = 0;
    }, { passive: true });
    window.addEventListener("touchmove", (e) => {
      if (y0 == null) return;
      const d = e.touches[0].clientY - y0;
      estirado = d > 0 ? Math.min(d * 0.5, 96) : 0;
      ptr.classList.remove("is-suelto");
      ptr.style.height = estirado + "px";
      ptr.classList.toggle("is-listo", estirado >= UMBRAL);
      ptrTxt.textContent = estirado >= UMBRAL ? "Soltá para actualizar" : "Estirá para actualizar";
    }, { passive: true });
    window.addEventListener("touchend", async () => {
      if (y0 == null) return;
      y0 = null;
      ptr.classList.add("is-suelto");
      if (estirado >= UMBRAL) {
        actualizando = true;
        ptr.classList.remove("is-listo");
        ptr.classList.add("is-cargando");
        ptrTxt.textContent = "Actualizando…";
        ptr.style.height = "48px";
        const ok = await sincronizar();
        ptr.classList.remove("is-cargando");
        actualizando = false;
        toast(ok ? "✓ Lista actualizada" : pendientes.length ? "Sin señal: los ingresos se guardan cuando vuelva" : "Sin conexión: se muestra la última lista");
      }
      estirado = 0;
      ptr.style.height = "0px";
    });

    // ───────── Marcar ingreso ─────────
    function marcar(id, delta) {
      const g = datos.grupos.find((x) => x.id === id);
      if (!g) return;
      const actual = ingresaron(g);
      if (delta > 0 && actual >= g.total) return;
      if (delta < 0 && actual <= 0) return;
      if (delta > 0 && (g.estado === "falta" || g.estado === "revisar")) {
        const motivo = g.estado === "falta" ? `Falta pagar ${pesos(g.falta)}.` : "Este pago hay que revisarlo.";
        if (!confirm(`${motivo}\n¿Marcar el ingreso igual?`)) return;
      }
      const op = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      if (DEMO) g.ingresaron = actual + delta;
      else pendientes.push({ id, nombre: g.nombre, delta, op });
      guardado.escribir("pendientes", pendientes);
      guardado.escribir("datos", datos);
      render();
      toast(delta > 0 ? `✓ Ingresó · ${g.nombre} (${actual + 1}/${g.total})` : `Se descontó un ingreso · ${g.nombre}`);
      enviarPendientes();
    }

    // ───────── Pantalla ─────────
    const ESTADOS = {
      ok: () => "✅ Pagado",
      sinverificar: () => "🟡 Pagó · sin verificar",
      falta: (g) => "⚠️ Falta " + pesos(g.falta),
      revisar: () => "❓ Revisar",
    };

    function tarjeta(g) {
      const n = ingresaron(g);
      const completo = g.total > 0 && n >= g.total;
      const chips = Object.keys(g.entradas || {}).map((c) => `<span class="chip">${esc(c)} ×${g.entradas[c]}</span>`).join("");
      return `
        <article class="g g--${g.estado}${completo ? " is-completo" : ""}">
          <div class="g__top">
            <h2>${esc(g.nombre)}</h2>
            <span class="estado estado--${g.estado}">${ESTADOS[g.estado](g)}</span>
          </div>
          ${g.quienes ? `<p class="g__quienes"><b>Van:</b> ${esc(g.quienes)}</p>` : ""}
          <p class="g__meta">${chips}${g.tel ? `<span>Tel. …${esc(g.tel)}</span>` : ""}<span>Fila ${g.filas.join(" + ")}</span></p>
          ${g.nota ? `<p class="g__nota">${esc(g.nota)}</p>` : ""}
          ${g.suelta ? "" : `
          <div class="ingreso">
            <button type="button" class="ingreso__menos" data-menos="${g.id}" aria-label="Descontar un ingreso" ${n ? "" : "disabled"}>−</button>
            <p class="ingreso__cuenta"><strong>${n}</strong> de ${g.total} ${g.total === 1 ? "entrada" : "entradas"}</p>
            <button type="button" class="ingreso__mas" data-mas="${g.id}" ${completo ? "disabled" : ""}>${completo ? "✓ Ya entraron" : "+ Ingresó"}</button>
          </div>`}
        </article>`;
    }

    // ───────── Pagos: verificar comprobantes ─────────
    const verificando = new Set();
    let loteTxt = "";
    const pendientePago = (g) => !g.suelta && (g.cuotas || []).some((c) => !c.verificado);
    // Los "Revisar" no entran: puede que ya hayan pagado y su 2ª cuota esté sin unir
    const faltaSegunda = (g) => !g.suelta && g.estado === "falta";

    // ───────── Recordatorio de la 2ª cuota por WhatsApp ─────────
    // Tienen que coincidir con CONFIG en js/main.js
    const RECORDATORIO = {
      vence: "10 de diciembre",
      alias: "delfi.palacios123",
      titular: "Delfina Nahir Palacios Gomez",
      link: "https://is.gd/hgCobI", // link corto a la invitación (el mismo del evento del calendario)
    };
    let enviados = guardado.leer("enviados", {}); // { id: fecha en que se abrió el WhatsApp }

    // Teléfono argentino → número para wa.me (549 + código de área + número, sin 0 ni 15)
    function numeroWhatsApp(tel) {
      let d = String(tel || "").replace(/\D/g, "");
      if (d.startsWith("00")) d = d.slice(2);
      if (d.startsWith("54")) d = d.slice(2);
      if (d.startsWith("9") && d.length === 11) d = d.slice(1);
      if (d.startsWith("0")) d = d.slice(1);
      if (d.length === 12) {
        for (const n of [2, 3, 4]) {
          if (d.substr(n, 2) === "15") { d = d.slice(0, n) + d.slice(n + 2); break; }
        }
      }
      // Sin código de área (por ej. 15 555-1234): se asume Mendoza
      if (d.length === 9 && d.startsWith("15")) d = d.slice(2);
      if (d.length === 7) d = "261" + d;
      return d.length === 10 ? "549" + d : "";
    }

    function mensajeRecordatorio(g) {
      const nombre = String(g.nombre).trim().split(/\s+/)[0];
      return `¡Hola ${nombre}! 👋 Te recordamos que la 2ª cuota de la Cena de Fin de Año del Hockey (${pesos(g.falta)}) vence el ${RECORDATORIO.vence}.\n\n` +
        `Alias: ${RECORDATORIO.alias} (${RECORDATORIO.titular})\n\n` +
        `Después de pagar, cargá el comprobante en ${RECORDATORIO.link} eligiendo "2ª cuota". ¡Gracias!`;
    }

    function tarjetaRecordatorio(g) {
      const chips = Object.keys(g.entradas || {}).map((c) => `<span class="chip">${esc(c)} ×${g.entradas[c]}</span>`).join("");
      const num = numeroWhatsApp(g.telefono);
      const enviado = enviados[g.id];
      const cuando = enviado ? new Date(enviado).toLocaleString("es-AR", { day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
      return `
        <article class="g g--falta${enviado ? " is-completo" : ""}">
          <div class="g__top">
            <h2>${esc(g.nombre)}</h2>
            <span class="estado estado--falta">${ESTADOS.falta(g)}</span>
          </div>
          <p class="g__meta">${chips}<span>${g.telefono ? "Tel. " + esc(g.telefono) : "Sin teléfono"}</span></p>
          ${num ? "" : `<p class="g__nota">${g.telefono ? "No se pudo armar el número de WhatsApp con ese teléfono." : "No cargó teléfono."} Buscalo en la fila ${g.filas[0]} de Inscriptos.</p>`}
          <div class="acciones">
            ${num
              ? `<a class="wsp" href="https://wa.me/${num}?text=${encodeURIComponent(mensajeRecordatorio(g))}" target="_blank" rel="noopener" data-wsp="${g.id}">${enviado ? `✓ Enviado ${cuando} · Mandar de nuevo` : "📱 Enviar WhatsApp"}</a>`
              : `<button type="button" disabled>📱 Sin número válido</button>`}
          </div>
        </article>`;
    }
    const sinRevisar = (g) => pendientePago(g) && g.cuotas.some((c) => !c.verificado && !c.chequeo);

    function tarjetaPago(g) {
      const chips = Object.keys(g.entradas || {}).map((c) => `<span class="chip">${esc(c)} ×${g.entradas[c]}</span>`).join("");
      const cuotas = (g.cuotas || []).map((c) => `
        <li class="cuota${c.verificado ? " is-ok" : ""}">
          <div class="cuota__fila"><span><b>${esc(c.pago)}</b> · ${pesos(c.monto)}</span><span class="cuota__est">${c.verificado ? "✅ Verificado" : "⏳ Sin verificar"}</span></div>
          ${c.chequeo ? `<p class="cuota__chequeo${/^⚠/.test(c.chequeo) ? " is-mal" : ""}">${esc(c.chequeo)}</p>` : ""}
          ${/^https:\/\//.test(c.link || "") ? `<a href="${esc(c.link)}" target="_blank" rel="noopener">Ver comprobante ↗</a>` : ""}
        </li>`).join("");
      const leyendo = verificando.has(g.id);
      const hayMal = g.cuotas.some((c) => !c.verificado && /^⚠/.test(c.chequeo));
      return `
        <article class="g g--${g.estado}">
          <div class="g__top">
            <h2>${esc(g.nombre)}</h2>
            <span class="estado estado--${g.estado}">${ESTADOS[g.estado](g)}</span>
          </div>
          <p class="g__meta">${chips}${g.suelta ? "" : `<span>Total ${pesos(g.esperado || 0)}</span>`}<span>Fila ${g.filas.join(" + ")}</span></p>
          ${g.nota ? `<p class="g__nota">${esc(g.nota)}</p>` : ""}
          <ul class="cuotas">${cuotas}</ul>
          ${pendientePago(g) ? `
          <div class="acciones">
            <button type="button" data-verificar="${g.id}" ${leyendo || loteTxt ? "disabled" : ""}>${leyendo ? "Leyendo comprobante…" : "🔍 Verificar"}</button>
            ${hayMal ? `<button type="button" class="secundario" data-amano="${g.id}" ${leyendo || loteTxt ? "disabled" : ""}>Verificar a mano</button>` : ""}
          </div>` : ""}
        </article>`;
    }

    // Lee los comprobantes sin verificar de esa compra; si coinciden, tilda "Pago verificado".
    // Devuelve true si respondió, false si hubo un error y null si no hay conexión.
    async function verificar(id, aMano, enLote) {
      const g = datos.grupos.find((x) => x.id === id);
      if (!g || verificando.has(id)) return false;
      if (aMano && !confirm(`¿Marcar como verificado el pago de ${g.nombre}?`)) return false;
      verificando.add(id);
      render();
      try {
        let json;
        if (DEMO) {
          await new Promise((r) => setTimeout(r, 900));
          json = { ok: true, grupo: demoVerificar(g, aMano) };
        } else {
          const res = await fetch(URL_SCRIPT, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ accion: "verificar", clave, fila: id, nombre: g.nombre, aMano: !!aMano }),
          });
          json = await res.json();
        }
        if (json.error === "clave") { pedirClave(true); return false; }
        if (json.error === "cambio") {
          alert("La planilla cambió. La lista se va a actualizar: buscalo de nuevo y volvé a verificar.");
          await cargar();
          return false;
        }
        if (!json.ok) { toast("No se pudo verificar: " + json.error); return false; }
        const i = datos.grupos.findIndex((x) => x.id === id);
        if (i >= 0 && json.grupo) datos.grupos[i] = json.grupo;
        guardado.escribir("datos", datos);
        if (!enLote) {
          const listo = json.grupo && json.grupo.cuotas.every((c) => c.verificado);
          toast(listo ? `✅ ${g.nombre}: pago verificado` : `⚠️ ${g.nombre}: hay que revisarlo`);
        }
        return true;
      } catch (e) {
        toast("Sin conexión: no se pudo verificar");
        return null;
      } finally {
        verificando.delete(id);
        render();
      }
    }

    async function verificarTodos() {
      const cola = datos.grupos.filter(sinRevisar).map((g) => g.id);
      if (!cola.length) return toast("No hay pagos sin revisar");
      let bien = 0;
      let mal = 0;
      for (let i = 0; i < cola.length; i++) {
        loteTxt = `Verificando ${i + 1} de ${cola.length}…`;
        const r = await verificar(cola[i], false, true);
        if (r === null) break;
        const g = datos.grupos.find((x) => x.id === cola[i]);
        if (g && g.cuotas.every((c) => c.verificado)) bien++; else mal++;
      }
      loteTxt = "";
      render();
      toast(`Listo: ${bien} verificados${mal ? `, ${mal} para revisar` : ""}`);
    }

    function render() {
      if (!datos) return mostrarSync();
      $("[data-buscar]").hidden = false;
      $("[data-contador]").hidden = false;
      $("[data-tabs]").hidden = false;
      $("[data-pie]").hidden = DEMO;
      document.querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.tab === vista)));
      const pend = datos.grupos.filter(pendientePago).length;
      $("[data-pend-n]").hidden = !pend;
      $("[data-pend-n]").textContent = pend;

      const total = datos.grupos.reduce((a, g) => a + g.total, 0);
      const dentro = datos.grupos.reduce((a, g) => a + ingresaron(g), 0);
      $("[data-cont-num]").textContent = `${dentro} / ${total}`;

      const q = norm($("[data-q]").value).split(/[^a-z0-9]+/).filter(Boolean);
      $("[data-limpiar]").hidden = !q.length;
      let lista = datos.grupos.filter((g) => {
        const texto = norm([g.nombre, g.quienes, Object.keys(g.entradas || {}).join(" "), g.tel].join(" "));
        return q.every((p) => texto.includes(p));
      });
      lista.sort((a, b) => norm(a.nombre).localeCompare(norm(b.nombre)));

      const el = $("[data-lista]");
      if (vista === "pagos") {
        const nSin = datos.grupos.filter(pendientePago).length;
        const nFalta = datos.grupos.filter(faltaSegunda).length;
        const nRevisar = datos.grupos.filter((g) => g.estado === "revisar").length;
        const filtros = `
          <div class="filtros">
            <button type="button" data-filtro="sinverificar" aria-pressed="${filtroPagos === "sinverificar"}">Sin verificar (${nSin})</button>
            <button type="button" data-filtro="falta" aria-pressed="${filtroPagos === "falta"}">Falta 2ª cuota (${nFalta})</button>
            <button type="button" data-filtro="revisar" aria-pressed="${filtroPagos === "revisar"}">Revisar (${nRevisar})</button>
          </div>`;
        if (filtroPagos === "revisar") {
          lista = lista.filter((g) => g.estado === "revisar");
          el.innerHTML = filtros +
            `<p class="ayuda">Cuotas que no se pudieron unir solas (por ejemplo, una 2ª cuota con otro nombre o teléfono que la 1ª). Corregí el nombre o el teléfono en la planilla para que coincidan y estirá para actualizar.</p>` +
            (lista.length
              ? lista.slice(0, MAX_TARJETAS).map(tarjetaPago).join("")
              : `<p class="ayuda">${q.length ? "No hay nada para revisar con ese nombre." : "✓ No hay nada para revisar."}</p>`);
          return mostrarSync();
        }
        if (filtroPagos === "falta") {
          lista = lista.filter(faltaSegunda);
          el.innerHTML = filtros +
            `<p class="ayuda">Tocá <b>WhatsApp</b> y se abre el chat con el recordatorio ya escrito: solo tenés que enviarlo. Los que ya mandaste quedan marcados en este celular.</p>` +
            (lista.length
              ? lista.slice(0, MAX_TARJETAS).map(tarjetaRecordatorio).join("")
              : `<p class="ayuda">${q.length ? "No hay nadie con ese nombre al que le falte pagar." : "✓ A nadie le falta la 2ª cuota."}</p>`);
          return mostrarSync();
        }
        lista = lista.filter(pendientePago);
        const nuevos = datos.grupos.filter(sinRevisar).length;
        el.innerHTML = filtros +
          `<p class="ayuda">Lee cada comprobante y busca el monto que corresponde y a Delfina Palacios. Si encuentra los dos, tilda <b>Pago verificado</b> en la planilla.</p>` +
          (nuevos || loteTxt ? `<button type="button" class="lote" data-todos ${loteTxt ? "disabled" : ""}>${loteTxt || `🔍 Verificar todos los sin revisar (${nuevos})`}</button>` : "") +
          (lista.length
            ? lista.slice(0, MAX_TARJETAS).map(tarjetaPago).join("")
            : `<p class="ayuda">${q.length ? "No hay pagos sin verificar con ese nombre." : "✓ Todos los pagos están verificados."}</p>`);
        return mostrarSync();
      }
      if (!lista.length) {
        el.innerHTML = `<p class="ayuda">${q.length ? "No hay nadie con ese nombre.<br>Probá con el apellido, la categoría (por ej. <b>8va</b>) o preguntá quién le compró la entrada." : "Todavía no hay inscriptos."}</p>`;
      } else {
        el.innerHTML =
          (q.length ? "" : `<p class="ayuda">Escribí un nombre, apellido o categoría. Podés combinar: <b>perez 8va</b></p>`) +
          lista.slice(0, MAX_TARJETAS).map(tarjeta).join("") +
          (lista.length > MAX_TARJETAS ? `<p class="ayuda">Hay ${lista.length - MAX_TARJETAS} más: seguí escribiendo para encontrarlos.</p>` : "");
      }
      mostrarSync();
    }

    function pedirClave(error) {
      clave = "";
      guardado.borrar("clave");
      $("[data-login]").hidden = false;
      $("[data-login-error]").hidden = !error;
      $("[data-buscar]").hidden = true;
      $("[data-contador]").hidden = true;
      $("[data-tabs]").hidden = true;
      $("[data-pie]").hidden = true;
      $("[data-lista]").innerHTML = "";
      $("[data-sync]").textContent = "Falta la clave";
      $("[data-clave]").focus();
    }

    // ───────── Eventos ─────────
    $("[data-login]").addEventListener("submit", (e) => {
      e.preventDefault();
      clave = $("[data-clave]").value.trim();
      if (!clave) return;
      guardado.escribir("clave", clave);
      $("[data-login]").hidden = true;
      $("[data-sync]").textContent = "Cargando…";
      sincronizar();
    });

    $("[data-q]").addEventListener("input", render);
    $("[data-limpiar]").addEventListener("click", () => { const q = $("[data-q]"); q.value = ""; render(); q.focus(); });
    $("[data-lista]").addEventListener("click", (e) => {
      const mas = e.target.closest("[data-mas]");
      const menos = e.target.closest("[data-menos]");
      if (mas) marcar(Number(mas.dataset.mas), 1);
      if (menos) marcar(Number(menos.dataset.menos), -1);
      const ver = e.target.closest("[data-verificar]");
      const amano = e.target.closest("[data-amano]");
      if (ver) verificar(Number(ver.dataset.verificar), false);
      if (amano) verificar(Number(amano.dataset.amano), true);
      if (e.target.closest("[data-todos]")) verificarTodos();
      const filtro = e.target.closest("[data-filtro]");
      if (filtro) {
        filtroPagos = filtro.dataset.filtro;
        guardado.escribir("filtroPagos", filtroPagos);
        render();
      }
      const wsp = e.target.closest("[data-wsp]");
      if (wsp) {
        // El link abre WhatsApp; acá solo se anota que ya se le mandó
        enviados[wsp.dataset.wsp] = Date.now();
        guardado.escribir("enviados", enviados);
        setTimeout(render, 300);
      }
    });
    document.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => {
      vista = b.dataset.tab;
      guardado.escribir("vista", vista);
      render();
      window.scrollTo(0, 0);
    }));
    $("[data-actualizar]").addEventListener("click", async () => {
      $("[data-sync]").textContent = "Actualizando…";
      toast((await sincronizar()) ? "✓ Lista actualizada" : "Sin conexión: se muestra la última lista");
    });
    $("[data-salir]").addEventListener("click", () => {
      if (pendientes.length && !confirm(`Hay ${pendientes.length} ingresos sin guardar todavía. ¿Cerrar igual?`)) return;
      guardado.borrar("datos"); guardado.borrar("pendientes");
      datos = null; pendientes = [];
      pedirClave(false);
    });
    window.addEventListener("online", sincronizar);
    window.addEventListener("offline", () => mostrarSync());
    document.addEventListener("visibilitychange", () => { if (!document.hidden) sincronizar(); });
    setInterval(() => { if (!document.hidden) sincronizar(); }, CADA);

    // ───────── Inicio ─────────
    if (DEMO) $("[data-demo]").hidden = false;
    if (!clave) pedirClave(false);
    else { render(); sincronizar(); }

    // Demo: simula la lectura (a Lucía le "falta" el monto, para ver cómo queda un caso a revisar)
    function demoVerificar(g, aMano) {
      const n = JSON.parse(JSON.stringify(g));
      n.cuotas.forEach((c) => {
        if (c.verificado) return;
        if (!aMano && /Lucía/.test(g.nombre)) { c.chequeo = "⚠️ no aparece $35.000 (vi $17.500)"; return; }
        c.verificado = true;
        c.chequeo = aMano ? "✅ Verificado a mano" : `✅ Leído: ${pesos(c.monto)} a Delfina Palacios`;
      });
      if (n.estado === "sinverificar" && n.cuotas.every((c) => c.verificado)) n.estado = "ok";
      return n;
    }

    function datosDemo() {
      const PRECIO = { "7ma": 35000, "8va": 35000, "9na": 35000, "10ma": 35000, "6ta": 70000, "5ta": 70000, PS: 70000 };
      const g = (id, nombre, quienes, tel, entradas, estado, falta, extra) => {
        const esperado = Object.keys(entradas).reduce((a, c) => a + PRECIO[c] * entradas[c], 0);
        const cuota = (pago, monto, verificado) => ({ fila: id, pago, monto, verificado, chequeo: verificado ? `✅ Leído: ${pesos(monto)} a Delfina Palacios` : "", link: "" });
        return Object.assign({
          id, nombre, quienes, tel, entradas, estado, falta, filas: [id], nota: "", esperado,
          total: Object.values(entradas).reduce((a, b) => a + b, 0), ingresaron: 0,
          cuotas: estado === "ok" ? [cuota("Total", esperado, true)]
            : estado === "sinverificar" ? [cuota("1ª cuota", esperado / 2, true), cuota("2ª cuota", esperado / 2, false)]
            : [cuota("1ª cuota", esperado / 2, false)],
        }, extra || {});
      };
      return {
        actualizado: new Date().toISOString(),
        grupos: [
          g(2, "Martín González", "Martín (PS), Sofía y Juan González (8va)", "1234", { "8va": 2, PS: 1 }, "ok", 0, { filas: [2, 9] }),
          g(3, "Laura Gómez", "Valentina Pérez (9na)", "8812", { "9na": 1 }, "ok", 0),
          g(4, "Lucía González", "", "4410", { "6ta": 1 }, "falta", 35000, { telefono: "0261 15 444-1000" }),
          g(5, "Carolina Díaz", "Carolina y Pablo Díaz (PS)", "7720", { PS: 2 }, "sinverificar", 0),
          g(6, "Tomás Fernández", "", "3011", { "5ta": 1 }, "ok", 0, { ingresaron: 1 }),
          g(7, "Juan Pérez", "", "5590", { PS: 1 }, "revisar", 35000, { nota: "Puede que su 2ª cuota sea la fila 11 de Inscriptos." }),
          g(9, "Sofía Romero", "", "", { "8va": 1 }, "falta", 17500, { telefono: "155" }),
          g(8, "Ana Sosa", "Ana Sosa (PS), Mateo Sosa (10ma)", "", { "10ma": 1, PS: 1 }, "ok", 0),
          g("s11", "Juan Perez García", "", "", { PS: 1 }, "revisar", 0, { suelta: true, total: 0, filas: [11], nota: "2ª cuota sin unir a su 1ª cuota (¿fila 7?). Corregí el teléfono o el nombre en Inscriptos para que coincidan con la 1ª cuota." }),
        ],
      };
    }
  })();
  </script>
